<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sentry — Vulnerability Remediation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Base scale — screen-share / interview */
    --font-base: 18px;
    --font-sm: 14px;
    --font-xs: 13px;
    --font-xxs: 12px;
    /* Backgrounds: slightly lifted vs pure black so panels read as “cards” on Zoom */
    --bg-0: #12151c;
    --bg-1: #1a1e28;
    --bg-2: #222831;
    --bg-3: #2c3340;
    --line: #343c4a;
    --line-soft: #232a34;
    --ink-0: #f7f8fa;
    --ink-1: #c5cdd8;
    --ink-2: #9aa6b4;
    --ink-3: #5c6674;
    --accent: #7dd3a0;
    --accent-dim: rgba(125, 211, 160, 0.12);
    --warn: #f0b560;
    --warn-dim: rgba(240, 181, 96, 0.12);
    --crit: #f07060;
    --crit-dim: rgba(240, 112, 96, 0.12);
    --info: #7aa5ff;
    --info-dim: rgba(122, 165, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-0);
    color: var(--ink-0);
    font-family: 'Sora', system-ui, sans-serif;
    font-size: var(--font-base);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "ss01","ss02"; }

  /* ------------------------ layout --------------------------- */
  .shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 16px; }
  .brand .name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
  }
  .brand .name::before {
    content: "◆"; color: var(--accent); margin-right: 8px; font-size: 12px;
  }
  .brand .sub {
    font-size: var(--font-sm); color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
  }
  .brand .sub code {
    color: var(--ink-1);
    background: var(--bg-2);
    padding: 2px 8px; border-radius: 4px;
    border: 1px solid var(--line);
  }

  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .mode-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xxs); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-1);
    background: var(--bg-2);
  }
  .mode-pill.live { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .mode-pill.mock { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); display: inline-block; margin-right: 6px;
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(125, 211, 160, 0.6); }
    70%  { box-shadow: 0 0 0 6px rgba(125, 211, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(125, 211, 160, 0); }
  }

  /* ------------------------ content grid --------------------------- */
  main {
    padding: 28px 28px 32px;
    display: grid;
    gap: 24px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }

  .section-title {
    font-size: var(--font-xs); font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-2);
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-title .hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: var(--font-xs); }

  /* ------------------------ KPI row --------------------------- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .kpi {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--info);
  }
  .kpi.ok::before    { background: var(--accent); }
  .kpi.warn::before  { background: var(--warn); }
  .kpi.crit::before  { background: var(--crit); }
  .kpi .label {
    font-size: var(--font-xxs); color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.15em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .kpi .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.25rem; font-weight: 600;
    color: var(--ink-0);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .kpi .value .unit {
    font-size: var(--font-sm); color: var(--ink-2); margin-left: 4px; font-weight: 400;
  }
  .kpi .sub {
    margin-top: 10px;
    font-size: var(--font-xs); color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
    display: flex; justify-content: space-between;
  }
  .kpi .sub strong { color: var(--ink-1); font-weight: 500; }

  /* ------------------------ panels --------------------------- */
  .panels {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  @media (max-width: 1100px) {
    .panels { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  .panel {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-1);
  }
  .panel-header .title {
    font-size: 1.05rem; font-weight: 600; color: var(--ink-0);
  }
  .panel-header .meta { font-size: var(--font-xs); color: var(--ink-2); font-family: 'JetBrains Mono', monospace; }
  .panel-body { padding: 0; }

  /* ------------------------ vuln table --------------------------- */
  table.vulns {
    width: 100%; border-collapse: collapse;
    font-size: var(--font-sm);
  }
  table.vulns th {
    text-align: left; padding: 12px 18px;
    font-size: var(--font-xxs); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-2);
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
  }
  table.vulns td {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  table.vulns tr:last-child td { border-bottom: none; }
  table.vulns tr { transition: background 120ms ease; }
  table.vulns tr:hover { background: var(--bg-2); cursor: pointer; }
  table.vulns td.pkg .cve {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xs); color: var(--ink-2); display: block;
  }
  table.vulns td.pkg .name { font-weight: 500; color: var(--ink-0); }

  .sev-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px; vertical-align: middle;
  }
  .sev-critical .sev-dot { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
  .sev-high .sev-dot { background: var(--warn); }
  .sev-moderate .sev-dot { background: var(--info); }
  .sev-low .sev-dot { background: var(--ink-3); }
  .sev-unknown .sev-dot { background: var(--ink-3); }
  .sev-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xxs); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-1);
  }

  .status-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xxs); font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px;
    display: inline-block;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--ink-1);
  }
  .status-chip.running { border-color: var(--info); color: var(--info); background: var(--info-dim); }
  .status-chip.running::before {
    content: "●"; margin-right: 5px;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
  .status-chip.pr_opened { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }
  .status-chip.merged    { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .status-chip.failed    { border-color: var(--crit); color: var(--crit); background: var(--crit-dim); }
  .status-chip.skipped   { color: var(--ink-2); }

  .route-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xs); text-transform: lowercase;
    color: var(--ink-2);
  }
  .route-chip strong { color: var(--ink-1); font-weight: 500; }

  td.links a {
    color: var(--ink-2);
    font-size: var(--font-xs);
    text-decoration: none;
    margin-right: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  td.links a:hover { color: var(--accent); }
  td.timing {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xs); color: var(--ink-2);
  }

  td.session-cell {
    vertical-align: top;
  }
  .session-block {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 28rem;
  }
  .session-block a.session-open {
    font-size: var(--font-sm); font-weight: 600; color: var(--accent);
    text-decoration: none; font-family: 'JetBrains Mono', monospace;
  }
  .session-block a.session-open:hover { text-decoration: underline; }
  .session-block .session-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--font-xs);
    color: var(--ink-1);
    line-height: 1.35;
    word-break: break-all;
  }

  /* ------------------------ right panel --------------------------- */
  .activity-item {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: baseline;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-3); transform: translateY(4px);
  }
  .activity-item.new .activity-dot { background: var(--accent); }
  .activity-item.done .activity-dot { background: var(--info); }
  .activity-item.fail .activity-dot { background: var(--crit); }
  .activity-text {
    font-size: var(--font-sm); color: var(--ink-1); line-height: 1.55;
  }
  .activity-text strong { color: var(--ink-0); font-weight: 500; }
  .activity-text .mono { color: var(--ink-2); font-size: var(--font-xs); }
  .activity-time {
    font-size: var(--font-xs); color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  /* ------------------------ footer --------------------------- */
  footer {
    padding: 28px;
    text-align: center;
    color: var(--ink-3);
    font-size: var(--font-xs);
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--line);
    margin-top: 20px;
  }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--ink-0); }

  /* ------------------------ empty states --------------------------- */
  .empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-2);
    font-size: var(--font-sm);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ------------------------ small sparkbar --------------------------- */
  .sev-bar {
    display: flex; height: 4px; margin-top: 12px; border-radius: 2px; overflow: hidden;
    background: var(--bg-2);
  }
  .sev-bar span { display: block; height: 100%; }
  .sev-bar .critical { background: var(--crit); }
  .sev-bar .high     { background: var(--warn); }
  .sev-bar .moderate { background: var(--info); }
  .sev-bar .low      { background: var(--ink-3); }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="name">sentry</div>
      <div class="sub">tracking <code>{{ target_repo }}</code></div>
    </div>
    <div class="topbar-right">
      <span class="mono" style="font-size: var(--font-xs); color: var(--ink-2);">
        <span class="live-dot"></span>updated just now
      </span>
      <span class="mode-pill {{ 'live' if devin_mode == 'live' else 'mock' }}">
        devin: {{ devin_mode }}
      </span>
    </div>
  </header>

  <main>
    <!-- KPIs -->
    <section>
      <div class="section-title">
        <span>Remediation Overview</span>
        <span class="hint" id="scope-hint">last 7 days · all severities</span>
      </div>
      <div class="kpi-row" id="kpis"></div>
    </section>

    <!-- panels -->
    <section class="panels">
      <div class="panel">
        <div class="panel-header">
          <div class="title">Active Vulnerabilities</div>
          <div class="meta" id="vuln-count">—</div>
        </div>
        <div class="panel-body">
          <table class="vulns">
            <thead>
              <tr>
                <th>Package</th>
                <th>Severity</th>
                <th>Route</th>
                <th>Status</th>
                <th>Devin Session</th>
                <th>Dispatched</th>
              </tr>
            </thead>
            <tbody id="vuln-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="title">Event Stream</div>
          <div class="meta">last 20</div>
        </div>
        <div class="panel-body" id="activity"></div>
      </div>
    </section>

  </main>

  <footer>
    built as a cognition take-home · polls every 5s · <a href="/api/metrics">raw metrics</a> · <a href="/api/vulnerabilities">raw vulns</a>
  </footer>
</div>

<script>
  // -------- formatting helpers
  const fmt = {
    num(x, d=0) {
      if (x === null || x === undefined) return '—';
      return Number(x).toFixed(d);
    },
    pct(x) { return x === null || x === undefined ? '—' : (x * 100).toFixed(1) + '%'; },
    minutes(x) { return x === null || x === undefined ? '—' : x < 60 ? `${x.toFixed(0)}m` : `${(x/60).toFixed(1)}h`; },
    ago(iso) {
      if (!iso) return '—';
      const d = new Date(iso), now = new Date();
      const s = Math.max(1, Math.floor((now - d) / 1000));
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      if (s < 86400) return `${Math.floor(s/3600)}h ago`;
      return `${Math.floor(s/86400)}d ago`;
    },
  };

  // -------- KPI rendering
  function renderKPIs(m) {
    const kpis = document.getElementById('kpis');
    const rate = m.success_rate || 0;
    const rateClass = rate >= 0.85 ? 'ok' : rate >= 0.6 ? 'warn' : 'crit';
    const sevTotal = Object.values(m.by_severity || {}).reduce((a,b)=>a+b, 0) || 1;
    const sev = m.by_severity || {};

    kpis.innerHTML = `
      <div class="kpi ok">
        <div class="label">Total Tracked</div>
        <div class="value">${m.total}</div>
        <div class="sev-bar">
          <span class="critical" style="flex:${sev.critical || 0}"></span>
          <span class="high"     style="flex:${sev.high || 0}"></span>
          <span class="moderate" style="flex:${sev.moderate || 0}"></span>
          <span class="low"      style="flex:${sev.low || 0}"></span>
        </div>
        <div class="sub"><span>+${m.detected_24h || 0} in last 24h</span></div>
      </div>

      <div class="kpi ${rateClass}">
        <div class="label">Success Rate</div>
        <div class="value">${fmt.pct(m.success_rate)}</div>
        <div class="sub">
          <span><strong>${m.merged}</strong> merged</span>
          <span><strong>${m.pr_opened}</strong> pr open</span>
          <span><strong>${m.failed}</strong> failed</span>
        </div>
      </div>

      <div class="kpi warn">
        <div class="label">Time to PR (p50)</div>
        <div class="value">${m.time_to_pr_p50 !== null && m.time_to_pr_p50 !== undefined ? m.time_to_pr_p50.toFixed(0) : '—'}<span class="unit">min</span></div>
        <div class="sub">
          <span>p95: <strong>${m.time_to_pr_p95 !== null && m.time_to_pr_p95 !== undefined ? m.time_to_pr_p95.toFixed(0) + 'm' : '—'}</strong></span>
          <span>mttr p50: <strong>${fmt.minutes(m.mttr_p50)}</strong></span>
        </div>
      </div>

      <div class="kpi ok">
        <div class="label">Cost vs. Engineer Time</div>
        <div class="value">${m.cost_savings_multiplier !== null && m.cost_savings_multiplier !== undefined ? m.cost_savings_multiplier.toFixed(0) : '—'}<span class="unit">×</span></div>
        <div class="sub">
          <span><strong>$${m.cost_per_success_usd !== null && m.cost_per_success_usd !== undefined ? m.cost_per_success_usd.toFixed(2) : '—'}</strong> devin</span>
          <span><strong>$200</strong> engineer</span>
        </div>
      </div>
    `;
  }

  // -------- vuln table
  function renderVulns(rows) {
    document.getElementById('vuln-count').textContent = `${rows.length} rows`;
    const tbody = document.getElementById('vuln-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty">no vulnerabilities yet. run <code>docker compose exec app python -m app.workers.scanner</code> to seed fixtures.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(v => {
      const sevClass = `sev-${v.severity}`;
      const route = v.triage_decision || '—';
      const routeLabel = route === 'devin'
        ? `<strong>devin</strong>`
        : route === 'dependabot'
        ? `dependabot`
        : route === 'skip'
        ? `skip`
        : `—`;
      const sessionLink = v.devin_session_id
        ? `<div class="session-block" onclick="event.stopPropagation();">
             ${v.devin_session_url
               ? `<a href="${v.devin_session_url}" target="_blank" rel="noopener" class="session-open">open session →</a>`
               : ''}
             <span class="session-id" title="Full Devin session id">${v.devin_session_id}</span>
           </div>`
        : `<span style="color: var(--ink-3);">—</span>`;
      const prLink = v.devin_pr_url ? `<a href="${v.devin_pr_url}" target="_blank">pr</a>` : '';
      const issueLink = v.github_issue_url ? `<a href="${v.github_issue_url}" target="_blank">issue</a>` : '';
      return `
        <tr onclick="location.href='/vulnerabilities/${v.id}'">
          <td class="pkg">
            <div class="name">${v.package} <span class="mono" style="color: var(--ink-3); font-size: var(--font-xs);">${v.current_version || ''}</span></div>
            <span class="cve">${v.cve_id}</span>
          </td>
          <td class="${sevClass}"><span class="sev-dot"></span><span class="sev-label">${v.severity}</span></td>
          <td><span class="route-chip">${routeLabel}</span></td>
          <td><span class="status-chip ${v.status}">${v.status.replace('_', ' ')}</span></td>
          <td class="links session-cell">${sessionLink} ${prLink} ${issueLink}</td>
          <td class="timing">${fmt.ago(v.dispatched_at || v.first_seen_at)}</td>
        </tr>
      `;
    }).join('');
  }

  // -------- activity stream — synthesized from vuln list
  function renderActivity(rows) {
    const events = [];
    rows.forEach(v => {
      if (v.merged_at) events.push({
        at: v.merged_at, class: 'done',
        text: `<strong>${v.package}</strong> merged — <span class="mono">${v.cve_id}</span>`,
      });
      if (v.pr_opened_at) events.push({
        at: v.pr_opened_at, class: 'new',
        text: `pr opened for <strong>${v.package}</strong> — <span class="mono">${v.cve_id}</span>`,
      });
      if (v.dispatched_at) events.push({
        at: v.dispatched_at, class: 'new',
        text: `dispatched <strong>${v.package}</strong> to devin${
          v.devin_session_id
            ? ` <span class="mono" style="color: var(--ink-2);">${v.devin_session_id}</span>`
            : ''
        }`,
      });
      if (v.status === 'failed') events.push({
        at: v.dispatched_at, class: 'fail',
        text: `remediation blocked: <strong>${v.package}</strong>`,
      });
      if (v.first_seen_at) events.push({
        at: v.first_seen_at, class: '',
        text: `detected <strong>${v.cve_id}</strong> <span class="mono">via ${v.source}</span>`,
      });
    });
    events.sort((a, b) => (a.at > b.at ? -1 : 1));
    const container = document.getElementById('activity');
    if (!events.length) {
      container.innerHTML = `<div class="empty">no activity yet</div>`;
      return;
    }
    container.innerHTML = events.slice(0, 20).map(e => `
      <div class="activity-item ${e.class}">
        <span class="activity-dot"></span>
        <span class="activity-text">${e.text}</span>
        <span class="activity-time">${fmt.ago(e.at)}</span>
      </div>
    `).join('');
  }

  // -------- refresh loop
  async function refresh() {
    try {
      const [m, vs] = await Promise.all([
        fetch('/api/metrics').then(r => r.json()),
        fetch('/api/vulnerabilities').then(r => r.json()),
      ]);
      renderKPIs(m);
      renderVulns(vs);
      renderActivity(vs);
    } catch (e) { console.error(e); }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
